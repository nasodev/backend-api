name: funq-backend-api

services:
  backend-api:
    build:
      context: .
      target: development

    # container_name 삭제 (중요!)

    ports:
      - "28000:8000"

    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./tests:/app/tests:ro
      - ./firebase:/app/firebase:ro
      - ~/.claude:/home/appuser/.claude
      - blog-images:/app/data/blog-images

    env_file:
      - .env

    environment:
      - DEBUG=true
      - DATABASE_URL=postgresql://backend_api:${DB_PASSWORD}@postgres:5432/backend_api

    networks:
      - funq-network

    labels:
      - "com.funq.project=true"
      - "com.funq.app=backend-api"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  funq-network:
    name: funq-network
    external: true

volumes:
  blog-images: